[package]
name = "noisegek-gen"
description = "NOISEGEK GEN: generador de ruido tocable por MIDI (instrumento)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "noisegek_gen_standalone"
path = "src/main.rs"
required-features = ["standalone"]

[features]
standalone = ["nih_plug/standalone"]

[dependencies]
noisegek-core = { path = "../noisegek-core" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git" }
